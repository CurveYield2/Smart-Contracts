name: cyvbWBTC IPOR Native Verify v1

on:
  push:
    paths:
      - 'cyvbWBTC/contracts/FxMintCyvbWbtcPositionFuse_v1.sol'
      - 'cyvbWBTC/contracts/FxMintCyvbWbtcBalanceFuse_v4.sol'
      - 'cyvbWBTC/contracts/FxMintCyvbWbtcInstantWithdrawFuse_v2.sol'
      - 'cyvbWBTC/contracts/FxMintVbWbtcPriceFeed_v2.sol'
      - 'cyvbWBTC/contracts/CyvbWbtcGatewayGatePreHook_v3.sol'
      - 'cyvbWBTC/script/DeployCyvbWBTC_v11.s.sol'
      - '.github/workflows/cyvbWBTC_ipor_native_verify_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge install foundry-rs/forge-std --no-git
      - name: Configure Foundry
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbWBTC/contracts"
          test = "cyvbWBTC/ipor-native-test-placeholder"
          script = "cyvbWBTC/ipor-native-script-placeholder"
          out = "out"
          libs = ["lib"]
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF
      - name: Build exact IPOR-native cyvbWBTC stack
        run: |
          forge build --sizes \
            cyvbWBTC/contracts/CyvbWbtcGateway_v3.sol \
            cyvbWBTC/contracts/CyvbWbtcGatewayGatePreHook_v3.sol \
            cyvbWBTC/contracts/CyvbWbtcLtvConfig_v3.sol \
            cyvbWBTC/contracts/FxMintVbWbtcPriceFeed_v2.sol \
            cyvbWBTC/contracts/FxMintCyvbWbtcPositionFuse_v1.sol \
            cyvbWBTC/contracts/FxMintCyvbWbtcBalanceFuse_v4.sol \
            cyvbWBTC/contracts/FxMintCyvbWbtcInstantWithdrawFuse_v2.sol \
            cyvbWBTC/script/DeployCyvbWBTC_v11.s.sol
