name: cyvbUSDC probe and compile v1

on:
  workflow_dispatch:
  push:
    paths:
      - "cyvbUSDC/**"
      - ".github/workflows/cyvbUSDC_probe_v1.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only probe dependency
        run: python -m pip install --disable-pip-version-check "web3>=7,<8"

      - name: Probe Katana reference configuration
        env:
          KATANA_RPC_URL: https://rpc.katana.network/
        run: python cyvbUSDC/scripts/katana_probe_v1.py

  compile-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Create ephemeral Foundry config
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbUSDC/contracts"
          out = "out"
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF

      - name: Compile v1 custom fuse
        run: forge build --sizes
