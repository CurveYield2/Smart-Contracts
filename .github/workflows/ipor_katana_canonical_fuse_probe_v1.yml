          echo "erc4626SupplyLatest5_code=$(cast code 0xf3891Ccb8801F76106d133401C2fF8b9cD299e65 --rpc-url https://katana.drpc.org/ | head -c 20)"
          echo "erc4626SupplyLatest5_market=$(cast call 0xf3891Ccb8801F76106d133401C2fF8b9cD299e65 'MARKET_ID()(uint256)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
          echo "erc4626SupplyLatest5_version=$(cast call 0xf3891Ccb8801F76106d133401C2fF8b9cD299e65 'VERSION()(address)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
          echo "erc4626Balance5_code=$(cast code 0x1660786a08b9cB0D50Cbb118a5A89A36D2E801d3 --rpc-url https://katana.drpc.org/ | head -c 20)"
          echo "erc4626Balance5_market=$(cast call 0x1660786a08b9cB0D50Cbb118a5A89A36D2E801d3 'MARKET_ID()(uint256)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
          echo "erc4626Balance5_version=$(cast call 0x1660786a08b9cB0D50Cbb118a5A89A36D2E801d3 'VERSION()(address)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
          echo "universalSwapperV2_code=$(cast code 0x2513bA6f5603217636973F130128fc0372084C1E --rpc-url https://katana.drpc.org/ | head -c 20)"
          echo "universalSwapperV2_market=$(cast call 0x2513bA6f5603217636973F130128fc0372084C1E 'MARKET_ID()(uint256)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
