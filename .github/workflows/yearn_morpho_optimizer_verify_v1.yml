name: Yearn Morpho optimizer verify v1

on:
  workflow_dispatch:
  push:
    paths:
      - "cyvbUSDC/yearn-morpho-optimizer/**"
      - ".github/workflows/yearn_morpho_optimizer_verify_v1.yml"

permissions:
  contents: read

concurrency:
  group: yearn-morpho-optimizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry (GitHub runner only)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned dependencies (GitHub runner only)
        shell: bash
        run: |
          forge install --no-git foundry-rs/forge-std
          forge install --no-git yearn/tokenized-strategy
          forge install --no-git morpho-org/morpho-blue
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v4.9.6

      - name: Write isolated ephemeral Foundry config
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "cyvbUSDC/yearn-morpho-optimizer/contracts"
          test = "cyvbUSDC/yearn-morpho-optimizer/test"
          out = "out"
          libs = ["lib"]
          solc = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          remappings = [
            "@tokenized-strategy/=lib/tokenized-strategy/src/",
            "@morpho-blue/=lib/morpho-blue/src/",
            "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
            "forge-std/=lib/forge-std/src/"
          ]
          EOF

      - name: Compile source without deploying
        run: forge build --sizes

      - name: Verify master allocation and Yearn PPS test cases
        run: forge test -vv
