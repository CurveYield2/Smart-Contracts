name: cyvbWBTC Compile v1
on:
  push:
    paths:
      - 'cyvbWBTC/contracts/**'
      - '.github/workflows/cyvbWBTC_compile_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile current cyvbWBTC contracts
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbWBTC/contracts"
          out = "out"
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF
          forge build --sizes
