name: cyvbUSDC verify v2

on:
  workflow_dispatch:
  push:
    paths:
      - "cyvbUSDC/**"
      - ".github/workflows/cyvbUSDC_verify_v2.yml"

permissions:
  contents: read

jobs:
  compile-and-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in GitHub runner
        run: forge install foundry-rs/forge-std --no-git

      - name: Create ephemeral Foundry config
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbUSDC/contracts"
          script = "cyvbUSDC/script"
          out = "out"
          libs = ["lib"]
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF

      - name: Compile cyvbUSDC v2 contracts and v1 deployment script
        run: forge build --sizes

      - name: Verify Katana chain
        run: |
          CHAIN_ID="$(cast chain-id --rpc-url https://rpc.katana.network/)"
          test "$CHAIN_ID" = "747474"

      - name: Verify existing CurveYield KAT to vbUSDC route
        shell: bash
        run: |
          ROUTE="$(cast call             0x01F9894f92ea9224fECc8C35482E20a05De13582             "routeFor(address,address)(bytes)"             0x7F1f4b4b29f5058fA32CC7a97141b8D7e5ABDC2d             0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36             --rpc-url https://rpc.katana.network/)"
          echo "KAT -> vbUSDC route: $ROUTE"
          if [ "$ROUTE" = "0x" ] || [ -z "$ROUTE" ]; then
            echo "::error::Existing CurveYield router has no KAT -> vbUSDC route configured."
            exit 1
          fi

      - name: Verify live Middle Way factory package
        shell: bash
        run: |
          echo "Live factory DAO fee packages:"
          cast call             0xc29b8D591d6a3f109Ca7ba384F2e00162866D37B             "getDaoFeePackages()((uint256,uint256,address)[])"             --rpc-url https://rpc.katana.network/
