name: cyvbETH Discovery v1

on:
  push:
    branches:
      - agent/cyvbeth-vault-stack
    paths:
      - ".github/workflows/cyvbETH_discovery_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyvbeth-discovery-v1
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Discover live Katana topology
        shell: bash
        run: |
          set -euo pipefail
          RPC="https://rpc.katana.network/"
          POOL_MANAGER="0x27b3eE81DF2Dd7356D5ac282e2416991A616f96a"
          VBETH="0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62"
          VBUSDC="0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36"
          SUSHI_FACTORY="0x203e8740894c8955cB8950759876d7E7E45E04c1"
          MORPHO="0xD50F2DffFd62f94Ee4AEd9ca05C61d0753268aBc"
          MORPHO_MARKET="0x2c4f26c76b4de51d3c9260c15a796cd2a35efab17786d0aa78ca2e638b0f8ba8"
          OUT="$RUNNER_TEMP/cyvbeth-discovery-v1.txt"

          TOPIC0="$(cast keccak "RegisterPool(address)")"
          python3 - "$RPC" "$POOL_MANAGER" "$TOPIC0" > "$RUNNER_TEMP/pools.txt" <<'PY'
import json,sys,urllib.request
rpc,addr,topic=sys.argv[1],sys.argv[2].lower(),sys.argv[3].lower()
def call(method, params):
    body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
    req=urllib.request.Request(rpc,data=body,headers={"Content-Type":"application/json"})
    with urllib.request.urlopen(req,timeout=30) as f:
        j=json.load(f)
    if "error" in j: raise RuntimeError(j["error"])
    return j["result"]
latest=int(call("eth_blockNumber",[]),16)
lo,hi=0,latest
while lo<hi:
    mid=(lo+hi)//2
    if call("eth_getCode",[addr,hex(mid)])!="0x": hi=mid
    else: lo=mid+1
start=lo
print("pool_manager_creation_block",start)
step=100000
seen=[]
for a in range(start,latest+1,step):
    b=min(a+step-1,latest)
    logs=call("eth_getLogs",[{"address":addr,"fromBlock":hex(a),"toBlock":hex(b),"topics":[topic]}])
    for log in logs:
        if len(log["topics"])>1:
            pool="0x"+log["topics"][1][-40:]
            if pool.lower() not in [x.lower() for x in seen]: seen.append(pool)
print("registered_pool_count",len(seen))
for p in seen: print("pool",p)
PY

          {
            echo "chain_id=$(cast chain-id --rpc-url "$RPC")"
            echo "vbeth_symbol=$(cast call "$VBETH" "symbol()(string)" --rpc-url "$RPC")"
            echo "vbeth_decimals=$(cast call "$VBETH" "decimals()(uint8)" --rpc-url "$RPC")"
            cat "$RUNNER_TEMP/pools.txt"
            while read -r tag pool; do
              [ "$tag" = "pool" ] || continue
              echo "POOL=$pool"
              set +e
              echo " collateral=$(cast call "$pool" "collateralToken()(address)" --rpc-url "$RPC" 2>/dev/null)"
              echo " fxusd=$(cast call "$pool" "fxUSD()(address)" --rpc-url "$RPC" 2>/dev/null)"
              echo " manager=$(cast call "$pool" "poolManager()(address)" --rpc-url "$RPC" 2>/dev/null)"
              echo " oracle=$(cast call "$pool" "priceOracle()(address)" --rpc-url "$RPC" 2>/dev/null)"
              echo " config=$(cast call "$pool" "configuration()(address)" --rpc-url "$RPC" 2>/dev/null)"
              echo " debt_range=$(cast call "$pool" "getDebtRatioRange()(uint256,uint256)" --rpc-url "$RPC" 2>/dev/null | tr '\n' ',')"
              set -e
            done < <(grep '^pool ' "$RUNNER_TEMP/pools.txt")

            for fee in 100 500 3000 10000; do
              echo "sushi_vbusdc_vbeth_fee_"$fee"=$(cast call "$SUSHI_FACTORY" "getPool(address,address,uint24)(address)" "$VBUSDC" "$VBETH" "$fee" --rpc-url "$RPC")"
            done

            echo "morpho_code=$(cast code "$MORPHO" --rpc-url "$RPC" | cut -c1-18)"
            echo "morpho_market_params=$(cast call "$MORPHO" "idToMarketParams(bytes32)(address,address,address,address,uint256)" "$MORPHO_MARKET" --rpc-url "$RPC" | tr '\n' ',')"
          } | tee "$OUT"
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: cyvbeth-discovery-v1
          path: ${{ runner.temp }}/cyvbeth-discovery-v1.txt
