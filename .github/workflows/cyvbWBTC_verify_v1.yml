name: cyvbWBTC Verify v1
on:
  push:
    paths:
      - 'cyvbWBTC/**'
      - '.github/workflows/cyvbWBTC_verify_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
      - name: Compile cyvbWBTC contracts and scripts
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbWBTC/contracts"
          script = "cyvbWBTC/script"
          test = "cyvbWBTC/test"
          out = "out"
          libs = ["lib"]
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF
          forge build --sizes
