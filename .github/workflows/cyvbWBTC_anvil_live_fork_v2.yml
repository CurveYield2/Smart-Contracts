name: cyvbWBTC Anvil Live Fork v2

on:
  workflow_dispatch:
  push:
    paths:
      - "cyvbWBTC/contracts/**"
      - "cyvbWBTC/script/DeployCyvbWBTC_v6.s.sol"
      - "cyvbWBTC/script/SimulateCyvbWBTC_v2.s.sol"
      - ".github/workflows/cyvbWBTC_anvil_live_fork_v2.yml"

permissions:
  contents: write

concurrency:
  group: cyvbwbtc-anvil-live-fork-v2
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std on runner
        run: forge install foundry-rs/forge-std --no-git

      - name: Configure Foundry
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbWBTC/contracts"
          script = "cyvbWBTC/script"
          test = "cyvbWBTC/test"
          out = "out"
          libs = ["lib"]
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF

      - name: Run isolated Katana Anvil live-fork simulation
        shell: bash
        run: |
          set +e
          mkdir -p cyvbWBTC/test-results
          RESULT="cyvbWBTC/test-results/CYVBWBTC_ANVIL_RESULT_v2.md"
          SIM_LOG="$RUNNER_TEMP/cyvbwbtc-anvil-simulation.log"
          ANVIL_LOG="$RUNNER_TEMP/cyvbwbtc-anvil-node.log"
          RPC="http://127.0.0.1:8545"
          LIVE_RPC="https://rpc.katana.network/"

          ROUTER=0x01F9894f92ea9224fECc8C35482E20a05De13582
          SAFE=0x47623C62f281807D615eeb4A2CEee9d97F9D3C49
          VBWBTC=0x0913DA6Da4b42f538B445599b46Bb4622342Cf52
          VBUSDC=0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36
          FXUSD=0x1364b238C668A2dec1294174e4798E8c09979f86

          FXUSD_TO_VBUSDC=0x1364b238c668a2dec1294174e4798e8c09979f86000064203a662b0bd271a6ed5a60edfbd04bfce608fd36
          VBUSDC_TO_FXUSD=0x203a662b0bd271a6ed5a60edfbd04bfce608fd360000641364b238c668a2dec1294174e4798e8c09979f86
          VBUSDC_TO_VBWBTC=0x203a662b0bd271a6ed5a60edfbd04bfce608fd360001f40913da6da4b42f538b445599b46bb4622342cf52

          anvil --fork-url "$LIVE_RPC" --chain-id 747474 --host 127.0.0.1 --port 8545 >"$ANVIL_LOG" 2>&1 &
          ANVIL_PID=$!

          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$RPC" >/dev/null 2>&1; then break; fi
            sleep 1
          done

          SETUP_RC=0
          test "$(cast chain-id --rpc-url "$RPC" 2>/dev/null)" = "747474" || SETUP_RC=1

          WALLET_JSON="$(cast wallet new --json 2>/dev/null)"
          PRIVATE_KEY="$(echo "$WALLET_JSON" | jq -r 'if type=="array" then .[0].private_key else .private_key end')"
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY" 2>/dev/null)"
          if [ -z "$PRIVATE_KEY" ] || [ -z "$DEPLOYER" ]; then SETUP_RC=1; fi
          cast rpc --rpc-url "$RPC" anvil_setBalance "$DEPLOYER" 0x3635C9ADC5DEA00000 >/dev/null 2>&1 || SETUP_RC=1

          cast rpc --rpc-url "$RPC" anvil_setBalance "$SAFE" 0x3635C9ADC5DEA00000 >/dev/null 2>&1 || SETUP_RC=1
          cast rpc --rpc-url "$RPC" anvil_impersonateAccount "$SAFE" >/dev/null 2>&1 || SETUP_RC=1

          configure_route() {
            TOKEN_IN="$1"
            TOKEN_OUT="$2"
            PATH="$3"
            cast send "$ROUTER" "setRoute(address,address,bytes)" "$TOKEN_IN" "$TOKEN_OUT" "$PATH" --from "$SAFE" --unlocked --rpc-url "$RPC" >/dev/null 2>&1 || return 1
            cast send "$ROUTER" "setRouteFeeBps(address,address,uint16)" "$TOKEN_IN" "$TOKEN_OUT" 0 --from "$SAFE" --unlocked --rpc-url "$RPC" >/dev/null 2>&1 || return 1
            cast send "$ROUTER" "setRouteTwapGuard(address,address,uint32,uint16)" "$TOKEN_IN" "$TOKEN_OUT" 900 200 --from "$SAFE" --unlocked --rpc-url "$RPC" >/dev/null 2>&1 || return 1
          }

          configure_route "$FXUSD" "$VBUSDC" "$FXUSD_TO_VBUSDC" || SETUP_RC=1
          configure_route "$VBUSDC" "$FXUSD" "$VBUSDC_TO_FXUSD" || SETUP_RC=1
          configure_route "$VBUSDC" "$VBWBTC" "$VBUSDC_TO_VBWBTC" || SETUP_RC=1
          cast rpc --rpc-url "$RPC" anvil_stopImpersonatingAccount "$SAFE" >/dev/null 2>&1 || true

          DECIMALS="$(cast call "$VBWBTC" "decimals()(uint8)" --rpc-url "$RPC" 2>/dev/null | awk '{print $1}')"
          if [ -z "$DECIMALS" ]; then
            DECIMALS=8
            SETUP_RC=1
          fi
          SIM_DEPOSIT_AMOUNT="$(python3 -c "print((10 ** int('$DECIMALS')) // 10)")"

          HOLDER=""
          CANDIDATES="0xFae375C9eA6636c40deB92DD91B7dbbF51BD3C68 0xE32B9b4C8f776687Ec54B4b6B62DbD9ce5fd4b99 0x744676B3CeD942D78F9b8e9cd22246Db5c32395c 0x47623C62f281807D615eeb4A2CEee9d97F9D3C49"

          has_amount() {
            addr="$1"
            bal="$(cast call "$VBWBTC" "balanceOf(address)(uint256)" "$addr" --rpc-url "$RPC" 2>/dev/null | awk '{print $1}')"
            [ -n "$bal" ] || return 1
            python3 -c "import sys; sys.exit(0 if int('$bal') >= int('$SIM_DEPOSIT_AMOUNT') else 1)"
          }

          for addr in $CANDIDATES; do
            if has_amount "$addr"; then HOLDER="$addr"; break; fi
          done

          if [ -z "$HOLDER" ]; then
            LATEST="$(cast block-number --rpc-url "$RPC" 2>/dev/null)"
            for BACK in 5000 10000 20000 50000 100000; do
              FROM="$(python3 -c "print(max(0, int('$LATEST') - int('$BACK')))")"
              LOGS="$(cast logs --json --rpc-url "$RPC" --from-block "$FROM" --to-block latest --address "$VBWBTC" "Transfer(address,address,uint256)" 2>/dev/null)"
              if [ -z "$LOGS" ]; then continue; fi
              while read -r topic; do
                [ -n "$topic" ] || continue
                addr="0x$(printf '%s' "$topic" | sed 's/^0x//' | tail -c 40)"
                if has_amount "$addr"; then HOLDER="$addr"; break; fi
              done < <(echo "$LOGS" | jq -r 'reverse | .[].topics[2] // empty' | head -n 250)
              [ -n "$HOLDER" ] && break
            done
          fi

          if [ -z "$HOLDER" ]; then
            SETUP_RC=1
            echo "No sufficiently funded vbWBTC holder found" >"$SIM_LOG"
          else
            cast rpc --rpc-url "$RPC" anvil_setBalance "$HOLDER" 0x3635C9ADC5DEA00000 >/dev/null 2>&1 || SETUP_RC=1
            cast rpc --rpc-url "$RPC" anvil_impersonateAccount "$HOLDER" >/dev/null 2>&1 || SETUP_RC=1
            cast send "$VBWBTC" "transfer(address,uint256)" "$DEPLOYER" "$SIM_DEPOSIT_AMOUNT" --from "$HOLDER" --unlocked --rpc-url "$RPC" >/dev/null 2>&1 || SETUP_RC=1
            cast rpc --rpc-url "$RPC" anvil_stopImpersonatingAccount "$HOLDER" >/dev/null 2>&1 || true
          fi

          SIM_RC=1
          if [ "$SETUP_RC" = "0" ]; then
            PRIVATE_KEY="$PRIVATE_KEY" SIM_DEPOSIT_AMOUNT="$SIM_DEPOSIT_AMOUNT" forge script cyvbWBTC/script/SimulateCyvbWBTC_v2.s.sol:SimulateCyvbWBTC_v2 --rpc-url "$RPC" --broadcast --slow -vvvv >"$SIM_LOG" 2>&1
            SIM_RC=$?
          fi

          {
            echo "# cyvbWBTC Anvil live-fork result v2"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Anvil chain ID: 747474"
            echo "- Fork source: Katana live RPC"
            echo "- Production state mutated: no"
            echo "- Setup exit code: $SETUP_RC"
            echo "- Simulation exit code: $SIM_RC"
            echo "- vbWBTC holder used on fork: $HOLDER"
            echo "- Simulated gross deposit: $SIM_DEPOSIT_AMOUNT base units"
            echo
            echo "## Simulation output"
            echo "~~~text"
            tail -n 240 "$SIM_LOG"
            echo "~~~"
            echo
            echo "## Anvil node tail"
            echo "~~~text"
            tail -n 120 "$ANVIL_LOG"
            echo "~~~"
          } > "$RESULT"

          echo "SETUP_RC=$SETUP_RC" >> "$GITHUB_ENV"
          echo "SIM_RC=$SIM_RC" >> "$GITHUB_ENV"

          kill "$ANVIL_PID" >/dev/null 2>&1 || true

      - name: Persist simulation result
        if: always()
        shell: bash
        run: |
          git config user.name "CurveYield2 CI"
          git config user.email "actions@users.noreply.github.com"
          git add cyvbWBTC/test-results/CYVBWBTC_ANVIL_RESULT_v2.md
          if ! git diff --cached --quiet; then
            git commit -m "test: record cyvbWBTC Anvil result v2 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce simulation
        if: always()
        shell: bash
        run: |
          test "$SETUP_RC" = "0"
          test "$SIM_RC" = "0"
