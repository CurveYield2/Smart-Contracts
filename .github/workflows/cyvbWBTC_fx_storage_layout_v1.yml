name: cyvbWBTC fx storage layout v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cyvbWBTC_fx_storage_layout_v1.yml'

permissions:
  contents: read

jobs:
  storage-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Aladdin f(x)
        uses: actions/checkout@v4
        with:
          repository: AladdinDAO/fx-protocol-contracts
          ref: main
          path: fx
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fx/package-lock.json

      - name: Install dependencies
        working-directory: fx
        run: npm ci

      - name: Enable compiler storage-layout output
        working-directory: fx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("hardhat.config.ts")
          s=p.read_text()
          s=s.replace(
              "settings: {\n          optimizer:",
              'settings: {\n          outputSelection: {"*": {"*": ["abi", "evm.bytecode", "storageLayout"]}},\n          optimizer:'
          )
          p.write_text(s)
          PY
          grep -n "outputSelection" hardhat.config.ts

      - name: Compile PoolManager layout in GitHub
        working-directory: fx
        run: npx hardhat compile

      - name: Locate PoolManager storage layout
        working-directory: fx
        shell: bash
        run: |
          echo "=== build info paths ==="
          find artifacts-hardhat -maxdepth 4 -type f | head -100
          echo "=== PoolManager storage layouts ==="
          python3 - <<'PY'
          import json, pathlib
          found=False
          for p in pathlib.Path("artifacts-hardhat").rglob("*.json"):
              try:
                  d=json.loads(p.read_text())
              except Exception:
                  continue
              out=d.get("output",{})
              c=out.get("contracts",{}).get("contracts/core/PoolManager.sol",{}).get("PoolManager",{})
              layout=c.get("storageLayout")
              if layout:
                  found=True
                  print("BUILD_INFO",p)
                  for row in layout.get("storage",[]):
                      print(row)
          if not found:
              raise SystemExit("PoolManager storage layout not found")
          PY
