name: cyvbETH Discovery v5

on:
  push:
    branches:
      - agent/cyvbeth-vault-stack
    paths:
      - ".github/workflows/cyvbETH_discovery_v5.yml"
      - ".github/scripts/cyvbETH_discovery_v5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyvbeth-discovery-v5
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Discover cyvbETH swap routes
        env:
          DISCOVERY_OUT: ${{ runner.temp }}/cyvbeth-discovery-v5.txt
        run: python3 .github/scripts/cyvbETH_discovery_v5.py
      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbeth-discovery-v5
          path: ${{ runner.temp }}/cyvbeth-discovery-v5.txt
