name: cyvbWBTC dependency probe v5

on:
  push:
    paths:
      - ".github/workflows/cyvbWBTC_dependency_probe_v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Probe live dependencies
        shell: bash
        run: |
          set -euo pipefail
          RPC=https://katana.drpc.org/
          FXBASE=0x6cf6757725886716Bc3c6A4bB93d02F1d1E3e7Dd
          CONFIG=0xB582Eb17059171D09B4F78f0BB63E47C7ceEfF62
          POOL=0xe32b9b4cF5a8ed03A19479923755E0daAc7D4b99
          PM=0xFae375C9eA6636c40deB92DD91B7dbbF51BD3C68
          VBWBTC=0x0913DA6Da4b42f538B445599b46Bb4622342Cf52
          VBUSDC=0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36
          SUSHI_FACTORY=0x203e8740894c8955cB8950759876d7E7E45E04c1

          echo "fxBASE stableToken=$(cast call $FXBASE 'stableToken()(address)' --rpc-url $RPC)"
          echo "fxBASE stable price=$(cast call $FXBASE 'getStableTokenPriceWithScale()(uint256)' --rpc-url $RPC)"
          echo "Pool fees=$(cast call $CONFIG 'getPoolFeeRatio(address,address)(uint256,uint256,uint256,uint256)' $POOL 0x0000000000000000000000000000000000000001 --rpc-url $RPC)"
          echo "vbWBTC scaling=$(cast call $PM 'getTokenScalingFactor(address)(uint256)' $VBWBTC --rpc-url $RPC)"
          for FEE in 100 500 3000 10000; do
            echo "Sushi vbWBTC/vbUSDC fee=$FEE pool=$(cast call $SUSHI_FACTORY 'getPool(address,address,uint24)(address)' $VBWBTC $VBUSDC $FEE --rpc-url $RPC)"
          done
