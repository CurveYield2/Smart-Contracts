name: cyvbWBTC Current Stack Verify v4

on:
  push:
    paths:
      - 'cyvbWBTC/contracts/**'
      - 'cyvbWBTC/test/**'
      - 'cyvbWBTC/script/DeployCyvbWBTC_v6.s.sol'
      - '.github/workflows/cyvbWBTC_current_stack_verify_v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Configure isolated current-stack Foundry build
        shell: bash
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          solc = "0.8.30"
          src = "cyvbWBTC/contracts"
          test = "cyvbWBTC/test"
          script = "cyvbWBTC/current-stack-script-placeholder"
          out = "out"
          libs = ["lib"]
          optimizer = true
          optimizer_runs = 10000000
          evm_version = "cancun"
          EOF

      - name: Build current deploy script and contracts
        run: |
          forge build --sizes \
            cyvbWBTC/contracts/CyvbWbtcGateway_v3.sol \
            cyvbWBTC/contracts/CyvbWbtcGatewayGatePreHook_v2.sol \
            cyvbWBTC/contracts/CyvbWbtcLtvConfig_v3.sol \
            cyvbWBTC/contracts/FxMintVbWbtcPriceFeed_v1.sol \
            cyvbWBTC/contracts/FxMintCyvbWbtcFuse_v4.sol \
            cyvbWBTC/contracts/FxMintCyvbWbtcBalanceFuse_v3.sol \
            cyvbWBTC/script/DeployCyvbWBTC_v6.s.sol

      - name: Run current cyvbWBTC unit tests only
        shell: bash
        run: |
          forge test -vvv \
            --match-path 'cyvbWBTC/test/CyvbWbtcGatewayV3Test_v1.t.sol' \
            --match-path 'cyvbWBTC/test/CyvbWbtcLtvConfigV3Test_v1.t.sol' \
            --match-path 'cyvbWBTC/test/FxMintVbWbtcPriceFeedV1Test_v1.t.sol' \
            --match-path 'cyvbWBTC/test/FxMintCyvbWbtcBalanceFuseV3Test_v1.t.sol' \
            --match-path 'cyvbWBTC/test/FxMintCyvbWbtcFuseV4Test_v2.t.sol'
