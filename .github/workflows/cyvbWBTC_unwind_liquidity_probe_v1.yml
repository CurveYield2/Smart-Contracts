name: cyvbWBTC Unwind Liquidity Probe v1
on:
  push:
    paths:
      - 'cyvbWBTC/scripts/ProbeUnwindLiquidity_v1.sh'
      - '.github/workflows/cyvbWBTC_unwind_liquidity_probe_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - env:
          KATANA_RPC_URL: https://katana.drpc.org/
        run: bash cyvbWBTC/scripts/ProbeUnwindLiquidity_v1.sh
