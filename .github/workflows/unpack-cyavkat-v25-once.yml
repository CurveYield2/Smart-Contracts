name: Unpack cyavKAT v25 deployment package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-cyavkat-v25-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Unpack verified source into dedicated cyavKAT directory
        shell: bash
        run: |
          set -euo pipefail
          archive=cyavKAT/cyavKAT_signing_layer_v25.zip
          digest=d69638b0622b2b5212a39af3d288b1da38be4131b5bc6c9deca2c1f8a4fe2176
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --
          unzip -tqq "$archive"
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          p="cyavKAT/cyavKAT_signing_layer_v25.zip"
          with zipfile.ZipFile(p) as z:
              entries=[i for i in z.infolist() if not i.is_dir()]
              assert len(entries)==322,f"expected 322 files, got {len(entries)}"
              assert len({i.filename for i in entries})==len(entries),"duplicate paths"
              for info in entries:
                  pp=PurePosixPath(info.filename)
                  assert len(pp.parts)>1 and pp.parts[0]=="cyavKAT",f"unexpected root {info.filename}"
                  assert not pp.is_absolute() and ".." not in pp.parts,f"unsafe path {info.filename}"
                  assert ((info.external_attr>>16)&0o170000)!=0o120000,f"symlink forbidden {info.filename}"
              assert any(i.filename=="cyavKAT/upgrade/script/P2_01_Deploy.s.sol" for i in entries)
              print("Verified 322 file paths and deployment entrypoint.")
          PY
          mkdir -p "$RUNNER_TEMP/cyavkat-stage"
          unzip -q "$archive" -d "$RUNNER_TEMP/cyavkat-stage"
          test -s "$RUNNER_TEMP/cyavkat-stage/cyavKAT/README.md"
          rsync -a "$RUNNER_TEMP/cyavkat-stage/cyavKAT/" cyavKAT/
          test -s "$archive"
          actual="$(find cyavKAT -type f | wc -l)"
          test "$actual" -eq 323 || { echo "::error::Expected 322 extracted files plus retained ZIP; got $actual";exit 1; }
          git add -A -- cyavKAT
          # Preserve the source archive's original whitespace exactly.
          # Content identity is verified by the ZIP checksum and file-count gates.
          changed="$(git diff --cached --name-only | wc -l)"
          echo "New/changed files staged: $changed"
          if [ "$changed" -ne 322 ]; then
            echo "::error::Expected 322 extracted files, got $changed staged file paths"
            exit 1
          fi
      - name: Commit extracted v25 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "::error::No files staged"; exit 1; }
          git commit -m "feat(cyavKAT): unpack 322 v25 deployment files alongside retained ZIP"
          git push origin HEAD:main
          echo "## cyavKAT v25 imported" >> "$GITHUB_STEP_SUMMARY"
          echo "322 extracted files under \`cyavKAT/\` plus the original 827481-byte ZIP." >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`d69638b0622b2b5212a39af3d288b1da38be4131b5bc6c9deca2c1f8a4fe2176\`" >> "$GITHUB_STEP_SUMMARY"
