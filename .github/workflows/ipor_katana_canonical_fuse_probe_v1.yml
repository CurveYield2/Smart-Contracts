          echo "universalSwapperBalanceV2_market=$(cast call 0x87dF04464459Bfb377aFB130aD3Fd98A0957C0b1 'MARKET_ID()(uint256)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
          echo "universalSwapperBalanceV2_version=$(cast call 0x87dF04464459Bfb377aFB130aD3Fd98A0957C0b1 'VERSION()(address)' --rpc-url https://katana.drpc.org/ 2>/dev/null || true)"
